<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | LEMS</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .reset-container {
            width: 400px;
            margin: 80px auto;
            padding: 30px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #1976d2;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #125aa0;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
    <script src="api-base.js"></script>
    <script src="api-config.js"></script>
</head>
<body>

<div class="reset-container">
    <h1>LEMS</h1>
    <h2>Reset Your Password</h2>

    <div id="resetForm">
        <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password">
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password">
        </div>

        <button onclick="submitNewPassword()">RESET PASSWORD</button>
    </div>

    <p id="message"></p>

    <p style="margin-top: 20px;">
        <a href="index.html">← Back to Login</a>
    </p>
</div>

<script>
    async function submitNewPassword() {
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get("token");
        const newPassword = document.getElementById("newPassword").value.trim();
        const confirmPassword = document.getElementById("confirmPassword").value.trim();
        const messageEl = document.getElementById("message");

        if (!token) {
            messageEl.textContent = "❌ Invalid reset link. Token is missing.";
            messageEl.style.color = "red";
            return;
        }

        if (!newPassword || !confirmPassword) {
            messageEl.textContent = "❌ Please enter and confirm your new password.";
            messageEl.style.color = "red";
            return;
        }

        if (newPassword !== confirmPassword) {
            messageEl.textContent = "❌ Passwords do not match.";
            messageEl.style.color = "red";
            return;
        }

        messageEl.textContent = "Updating password...";
        messageEl.style.color = "#1976d2";

        try {
            const response = await fetch("http://localhost:3000/api/reset-password", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token: token, new_password: newPassword })
            });

            const data = await response.json();

            if (response.ok) {
                messageEl.textContent = "✅ " + data.message;
                messageEl.style.color = "green";
                document.getElementById("resetForm").style.display = "none";
            } else {
                messageEl.textContent = "❌ " + (data.message || "Reset failed.");
                messageEl.style.color = "red";
            }
        } catch (error) {
            console.error("Reset password error:", error);
            messageEl.textContent = "❌ Cannot connect to server.";
            messageEl.style.color = "red";
        }
    }
</script>

</body>
</html>
