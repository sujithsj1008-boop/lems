<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMS - Lab Equipment Management System</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .form-tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            margin-top: 0;
            border-bottom: 3px solid transparent;
            border-radius: 0;
            width: auto;
        }

        .tab-btn.active {
            color: #1976d2;
            border-bottom-color: #1976d2;
            background: none;
        }

        .tab-btn:hover {
            background: none;
            color: #1976d2;
        }

        .form-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
            color: #334155;
        }

        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 8px;
            font-size: 13px;
            color: #1976d2;
            text-decoration: none;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }
    </style>
    <script src="api-base.js"></script>
    <script src="api-config.js"></script>
</head>

<body>

<div class="login-container">

    <h1>LEMS</h1>
    <h2>Lab Equipment Management System</h2>

    <div class="form-tabs" id="tabHeader">
        <button class="tab-btn active" id="loginTab" onclick="switchTab('login')">LOGIN</button>
        <button class="tab-btn" id="signupTab" onclick="switchTab('signup')">SIGN UP</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
        <div class="form-group">
            <label for="role">Login As</label>
            <select id="role">
                <option value="student">Student</option>
                <option value="admin">Administrator</option>
            </select>
        </div>

        <div class="form-group">
            <label for="studentId">User / Student ID</label>
            <input type="text" id="studentId" placeholder="Enter ID (e.g. S101)">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password">
            <a href="#" class="forgot-link" onclick="switchTab('forgot')">Forgot Password?</a>
        </div>

        <button onclick="login()">LOGIN</button>
    </div>

    <!-- SIGN UP FORM -->
    <div id="signupForm" style="display: none;">
        <div class="form-group">
            <label for="signupName">Full Name</label>
            <input type="text" id="signupName" placeholder="Enter Full Name">
        </div>

        <div class="form-group">
            <label for="signupStudentId">Student / User ID</label>
            <input type="text" id="signupStudentId" placeholder="Enter ID (e.g. S102)">
        </div>

        <div class="form-group">
            <label for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" placeholder="Enter Email">
        </div>

        <div class="form-group">
            <label for="signupPassword">Password</label>
            <input type="password" id="signupPassword" placeholder="Create Password">
        </div>

<button onclick="signup()" style="background: #16a34a;">CREATE ACCOUNT</button>
    </div>

    <!-- FORGOT PASSWORD FORM -->
    <div id="forgotForm" style="display: none;">
        <h3 style="margin-top: 0; color: #1976d2;">Forgot Password</h3>
        <p style="font-size: 14px; color: #64748b;">Enter your registered Email address to generate a password reset link.</p>

        <div class="form-group">
            <label for="forgotEmail">Registered Email</label>
            <input type="email" id="forgotEmail" placeholder="Enter your email address">
        </div>

        <button onclick="forgotPassword()" style="background: #0284c7;">GENERATE RESET LINK</button>

        <p id="forgotMessage" style="font-size: 13px; margin-top: 15px;"></p>

        <p style="margin-top: 15px;">
            <a href="#" onclick="switchTab('login')" style="color: #1976d2; font-size: 14px;">← Back to Login</a>
        </p>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
