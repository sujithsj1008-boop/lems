
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Equipment | LEMS</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5fa;
            margin: 0;
            padding: 30px;
            color: #1f2937;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 28px;
            border-radius: 12px;
            box-shadow: 0 4px 16px #00000012;
        }

        h1 {
            margin-top: 0;
            color: #173b70;
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccd3df;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 22px;
            background: #173b70;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #24569a;
        }

        #message {
            margin-top: 16px;
            font-weight: bold;
        }

        a {
            color: #173b70;
        }
    </style>
    <script src="api-base.js"></script>
    <script src="api-config.js"></script>
</head>

<body>
<div class="container">
    <h1>Add New Equipment</h1>
    <p>Enter the details of a new laboratory instrument.</p>

    <form id="equipmentForm">
        <label for="equipment_code">Equipment Code *</label>
        <input id="equipment_code" required
               placeholder="Example: ECE101">

        <label for="name">Equipment Name *</label>
        <input id="name" required
               placeholder="Example: Digital Oscilloscope">

        <label for="category">Category *</label>
        <input id="category" required
               placeholder="Example: Measurement">

        <label for="rfid_tag">RFID Tag *</label>
        <input id="rfid_tag" required
               placeholder="Enter unique RFID tag">

        <label for="calibration_limit">
            Calibration Runtime Limit (hours)
        </label>
        <input id="calibration_limit"
               type="number" min="0.01" step="0.01"
               value="500">

        <button type="submit" id="submitButton">
            Add Equipment
        </button>
    </form>

    <p id="message" role="status"></p>

    <a href="admin.html">Back to Admin Dashboard</a>
</div>

<script src="addequipment.js"></script>
</body>
</html>
